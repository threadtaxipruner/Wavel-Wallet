name: Product or design proposal
description: Propose a focused improvement to the Wavel specification.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: Do not include recovery phrases, private keys, passwords, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior, alternatives, and failure modes.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Identify new data, permissions, providers, or trust boundaries.
    validations:
      required: true
